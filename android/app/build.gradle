plugins { id 'com.android.application' }

android {
    namespace 'com.example.chatandroid'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.chatandroid'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        qa {
            initWith debug
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            matchingFallbacks = ['debug']
        }
        release { minifyEnabled false }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk false
        }
    }
    packaging {
        resources.excludes += ['libsignal_jni*.dylib', 'signal_jni*.dll', 'libsignal_jni*.so']
        jniLibs.excludes += ['**/libsignal_jni_testing.so']
    }
    testOptions { unitTests.all {
        systemProperty 'chat.root', System.getenv('CHAT_ROOT') ?: rootProject.projectDir.parentFile.absolutePath
        systemProperty 'java.io.tmpdir', System.getenv('CHAT_TMP') ?: System.getProperty('java.io.tmpdir')
    } }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'org.signal:libsignal-client:0.103.0'
    implementation 'org.signal:libsignal-android:0.103.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
