plugins { id 'com.android.application' }

android {
    namespace 'com.example.chatandroid'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.chatandroid'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.5.8'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            // Keep the same debug identity across sandboxed and ordinary builds.
            // The key stays outside this repository; never replace it to fix an update.
            def configuredKey = System.getenv('CHAT_ANDROID_DEBUG_KEYSTORE')
            if (configuredKey) storeFile file(configuredKey)
        }
        release {
            def keyPath = System.getenv('CHAT_ANDROID_RELEASE_KEYSTORE')
            if (keyPath) storeFile file(keyPath)
            storePassword System.getenv('CHAT_ANDROID_RELEASE_STORE_PASSWORD')
            keyAlias System.getenv('CHAT_ANDROID_RELEASE_KEY_ALIAS')
            keyPassword System.getenv('CHAT_ANDROID_RELEASE_KEY_PASSWORD')
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        qa {
            initWith debug
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk false
        }
    }
    packaging {
        resources.excludes += ['libsignal_jni*.dylib', 'signal_jni*.dll', 'libsignal_jni*.so']
        jniLibs.excludes += ['**/libsignal_jni_testing.so']
    }
    testOptions { unitTests.all {
        systemProperty 'chat.root', System.getenv('CHAT_ROOT') ?: rootProject.projectDir.toPath().toRealPath().parent.toFile().absolutePath
        systemProperty 'java.io.tmpdir', System.getenv('CHAT_TMP') ?: System.getProperty('java.io.tmpdir')
    } }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'org.signal:libsignal-client:0.103.0'
    implementation 'org.signal:libsignal-android:0.103.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
