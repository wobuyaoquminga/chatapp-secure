spring.application.name=chatapp-secure
server.address=127.0.0.1
server.port=${PORT:8082}
spring.datasource.url=jdbc:h2:file:./data/secure-chat;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
server.error.include-message=never
chat.jwt-secret=${JWT_SECRET:}
chat.allowed-origins=${CHAT_ALLOWED_ORIGINS:http://localhost:8082,http://127.0.0.1:8082}
