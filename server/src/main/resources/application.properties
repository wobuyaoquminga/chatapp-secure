spring.application.name=chat
server.address=127.0.0.1
server.port=${PORT:8082}
spring.datasource.url=jdbc:h2:file:./data/secure-chat;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
server.error.include-message=never
chat.jwt-secret=${JWT_SECRET:}
chat.allowed-origins=${CHAT_ALLOWED_ORIGINS:http://localhost:8082,http://127.0.0.1:8082}
chat.stun-urls=${CHAT_STUN_URLS:stun:stun.l.google.com:19302}
chat.turn-urls=${CHAT_TURN_URLS:}
chat.turn-shared-secret=${CHAT_TURN_SHARED_SECRET:}
chat.turn-ttl-seconds=${CHAT_TURN_TTL_SECONDS:600}
chat.updates-directory=${CHAT_UPDATES_DIRECTORY:./updates}
